<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>채보 플랫폼</title>

	<!-- 백엔드가 frontend/ 폴더를 /static 경로로 제공함 -->
	<link rel="stylesheet" href="/static/styles/root.css">
	<link rel="stylesheet" href="/static/styles/style.css">

	<!-- ONNX Runtime Web은 scripts/model.worker.js 안에서 불러옴 -->
	<script type="module" src="/static/scripts/main.js"></script>
</head>
<body class="bg-base text-main">
	<header class="app-header">
		<h1 class="app-title">채보 플랫폼 (기능 우선)</h1>
		<p class="text-sub">MP3를 고르면 브라우저 안에서 바로 채보합니다. 음원은 서버로 전송되지 않습니다.</p>
		<span class="text-sub">모델이 인식하지 못한 구간은 회색으로 표시됩니다.</span>
	</header>

	<main class="app-main">
		<!-- 입력 영역 -->
		<section class="panel bg-surface">
			<h2 class="panel-title">1. 음원 선택</h2>
			<div class="input-row">
				<input type="file" id="audio-input" class="file-input" accept=".mp3,audio/mpeg" aria-label="MP3 파일 선택">
				<button type="button" id="start-button" class="btn bg-primary text-white" disabled>채보 시작</button>
			</div>

			<div class="status-row">
				<p id="status-text" class="status-text text-sub" aria-live="polite">모델 준비 중...</p>
				<!-- 실패했을 때만 보이는 재시도 버튼 (모델 준비 실패 / 채보 실패 둘 다 사용) -->
				<button type="button" id="retry-button" class="btn btn-outline is-hidden">다시 시도</button>
				<!-- 채보 중에만 보이는 취소 버튼 (시작 버튼 자리를 밀지 않도록 상태 줄에 둠) -->
				<button type="button" id="cancel-button" class="btn btn-outline is-hidden">채보 취소</button>
			</div>

			<!-- 채보 진행 로딩바 (채보 시작 전에는 숨김) -->
			<div id="progress-bar" class="progress is-hidden" role="progressbar" aria-label="채보 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
				<div class="progress-info">
					<span class="progress-label text-sub"></span>
					<span class="progress-percent text-primary"></span>
				</div>
				<div class="progress-track">
					<div class="progress-fill"></div>
				</div>
			</div>
		</section>

		<!-- 출력 영역 -->
		<section class="panel bg-surface">
			<h2 class="panel-title">2. 채보 결과</h2>

			<!-- 원본 MP3 재생 + 다운로드 (파일을 고르면 보임) -->
			<div id="player-area" class="player-area is-hidden">
				<audio id="audio-player" class="audio-player" controls preload="metadata"></audio>
				<a id="download-link" class="btn btn-outline">원본 MP3 다운로드</a>
			</div>

			<!-- 구간 상태 범례 + 요약 (채보가 끝나면 보임) -->
			<div id="score-legend" class="score-legend is-hidden">
				<span class="legend-item"><span class="legend-box legend-failed"></span>채보 실패 구간</span>
				<span class="legend-item"><span class="legend-box legend-recovered"></span>재시도로 복구된 구간</span>
				<span class="legend-item"><span class="legend-line"></span>현재 재생 위치</span>
				<span id="score-summary" class="text-sub"></span>
			</div>

			<!-- 악기별 색 + 보이기/숨기기 (채보가 끝나면 보임) -->
			<div id="instrument-legend" class="instrument-legend is-hidden"></div>

			<div id="score-view" class="score-view">
				<p class="text-sub">채보가 끝나면 여기에 음표가 표시됩니다.</p>
			</div>
			<p class="score-help text-sub">악보를 클릭하면 그 위치부터 원본 음원을 재생합니다.</p>
		</section>
	</main>
</body>
</html>
